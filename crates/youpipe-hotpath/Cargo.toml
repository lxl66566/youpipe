optional = true

[dependencies.crossbeam-channel]
version  = "0.5"
optional = true

[dependencies.crossterm]
version  = "0.29"
optional = true

[dependencies.diesel]
version          = "2.3"
default-features = false
optional         = true

[dependencies.eyre]
version  = "0.6"
optional = true

[dependencies.flate2]
version  = "1"
optional = true

[dependencies.flume]
version  = "0.12.0"
optional = true

[dependencies.futures-channel]
version  = "0.3"
features = ["sink"]
optional = true

[dependencies.futures-util]
version  = "0.3"
features = ["sink"]
optional = true

[dependencies.hdrhistogram]
version          = "7"
default-features = false
optional         = true

[dependencies.hotpath-macros]
version = "0.24.0"

[dependencies.hotpath-meta]
version  = "0.24.0"
optional = true

[dependencies.http]
version  = "1"
optional = true

[dependencies.libc]
version  = "0.2.172"
optional = true

[dependencies.libsqlite3-sys]
version  = "0.30"
features = ["bundled"]
optional = true

[dependencies.object]
version          = "0.36"
default-features = false
