]
futures            = [
  "dep:futures-channel",
  "dep:tokio",
  "tokio/macros",
  "tokio/rt-multi-thread",
  "tokio/sync",
]
hotpath            = [
  "dep:arc-swap",
  "dep:cfg-if",
  "dep:crossbeam-channel",
  "dep:futures-util",
  "dep:hdrhistogram",
  "dep:libc",
  "dep:pin-project-lite",
  "dep:prettytable-rs",
  "dep:quanta",
  "dep:regex",
  "dep:serde",
  "dep:serde_json",
  "dep:tiny_http",
  "hotpath-macros/hotpath",
]
hotpath-alloc      = [
  "dep:tokio",
  "hotpath-macros/hotpath-alloc",
  "hotpath-meta?/hotpath-alloc",
]
hotpath-alloc-meta = ["hotpath-meta/hotpath-alloc-meta"]
hotpath-cpu        = [
  "dep:flate2",
  "dep:object",
  "dep:rustc-demangle",
  "dep:serde",
  "dep:serde_json",
  "hotpath-macros/hotpath-cpu",
]
hotpath-mcp        = [
  "dep:axum",
  "dep:rmcp",
  "dep:schemars",
