[dependencies.tracing]
version  = "0.1"
optional = true

[dependencies.tracing-subscriber]
version          = "0.3"
default-features = false
features         = ["registry"]
optional         = true

[dependencies.ureq]
version          = "3"
default-features = false
optional         = true

