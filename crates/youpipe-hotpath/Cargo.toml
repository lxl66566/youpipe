  "tokio/macros",
  "tokio/rt-multi-thread",
  "tokio/sync",
  "tokio/time",
]
tui                = [
  "crossbeam",
  "dep:clap",
  "dep:crossbeam-channel",
  "dep:crossterm",
  "dep:eyre",
  "dep:prettytable-rs",
  "dep:ratatui",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:tokio",
