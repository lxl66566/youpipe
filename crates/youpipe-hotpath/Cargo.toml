  "read",
  "std",
]
optional         = true

[dependencies.parking_lot]
version  = "0.12"
optional = true

[dependencies.pin-project-lite]
version  = "0.2.12"
optional = true

[dependencies.prettytable-rs]
version          = "0.10"
default-features = false
optional         = true

[dependencies.quanta]
version  = "0.12"
optional = true

[dependencies.ratatui]
version  = "0.30"
optional = true

[dependencies.regex]
version  = "1"
optional = true

[dependencies.reqwest]
version          = "0.13"
default-features = false
optional         = true

[dependencies.reqwest-012]
package          = "reqwest"
version          = "0.12"
default-features = false
optional         = true

[dependencies.reqwest-middleware-04]
package  = "reqwest-middleware"
version  = "0.4"
optional = true

[dependencies.reqwest-middleware-05]
package  = "reqwest-middleware"
version  = "0.5"
optional = true

[dependencies.rmcp]
version  = "1.4"
features = [
  "server",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
]
optional = true

[dependencies.rustc-demangle]
version  = "0.1.24"
optional = true

[dependencies.schemars]
version  = "1"
optional = true

[dependencies.serde]
version  = "1.0.130"
features = ["derive"]
optional = true

[dependencies.serde_json]
version  = "1.0"
optional = true

[dependencies.sqlx]
version          = "0.9"
default-features = false
