# Perf-event counter benchmarks (Linux only): criterion driven by hardware
# performance counters instead of wall-clock time, using the workspace's
# youpipe-criterion-perf-counters crate (a maintained fork of
# criterion-perf-events, publishable in its own right).
#
# A standalone crate rather than a root `benches/` target on purpose:
#   * `dev-dependencies` cannot be optional (cargo rejects
#     `optional = true` there), so a root bench would compile perfcnt — and
#     its nom 4 dependency, which carries a future-incompat warning — on
#     every `cargo bench` of the main suite, even when unused.
#   * perf/ is the established home for methodology tooling
#     (bench-suite/, hotpath-profile/, file-encrypt-bench/).
#
# Usage:
#   cargo bench --manifest-path perf/counter-bench/Cargo.toml --bench perf_events
#   PERF_EVENT=cycles    cargo bench --manifest-path perf/counter-bench/Cargo.toml
#   PERF_EVENT=walltime  cargo bench --manifest-path perf/counter-bench/Cargo.toml
#
# See the "perf-event counters" section in docs/src/dev/benchmarks.md for what the
# counters are good for (and what they are not).
[package]
name         = "youpipe-bench-counter"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
publish      = false

[[bench]]
harness = false
name    = "perf_events"

[dependencies]
# Sync-only bench: no tokio-runtime needed (verified: builds and benches fine
# without it now that the no-default-features build is fixed).
youpipe = { path = "../youpipe", default-features = false }

[dev-dependencies]
criterion               = "0.8"
criterion-perf-counters = { package = "youpipe-criterion-perf-counters", path = "../youpipe-criterion-perf-counters" }
perfcnt                 = "0.8"
rayon                   = "1"

# Lab bench (publish = false): intentionally not inheriting the workspace lint set.
[lints]
