[package]
name         = "youpipe-bench-pipeline"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
description  = "Mixed CPU/IO pipeline benchmark: youpipe vs rayon vs tokio vs sequential on a heavy-tailed document processing workload"
publish      = false

[dependencies]
rayon   = "1"
tokio   = { version = "1", features = ["rt-multi-thread", "time"] }
youpipe = { path = "../youpipe", default-features = true }

# Lab bench (publish = false): intentionally not inheriting the workspace lint set.
[lints]
