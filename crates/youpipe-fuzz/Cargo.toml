[package]
name    = "youpipe-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# cargo-fuzz marker: `cargo fuzz build|run` must be invoked from this
# directory (it compiles the bins below on a nightly toolchain with
# `-Zsanitizer=fuzzer[,address]`). Excluded from the root workspace on
# purpose: those flags would break plain `cargo build --workspace`.
[package.metadata]
cargo-fuzz = true

[[bin]]
bench = false
doc   = false
name  = "pipeline"
path  = "fuzz_targets/pipeline.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "stream"
path  = "fuzz_targets/stream.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "channel"
path  = "fuzz_targets/channel.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "reorder"
path  = "fuzz_targets/reorder.rs"
test  = false

[dependencies]
libfuzzer-sys = "0.4"
youpipe       = { path = "../youpipe" }

# Mirror of the root workspace's lint set (this crate is excluded from the
# workspace, so it inherits nothing).
[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"
