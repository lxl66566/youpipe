# Fork of st3 (https://github.com/asynchronics/st3) vendored into youpipe.
#
# Provenance: local fork repo at /root/programs/fork/st3, branch `main`
# (commit 12d3f1e, "Add performance optimization report") — a heavily
# optimized line on top of upstream v0.4.1 (bulk segmented steal copies,
# bounds-check removal, fast empty check, hoisted tail load, uninitialized
# buffer allocation, in-place Arc construction, single-item transfer fast
# path) plus the refined `src/transfer.rs` module from the `bulk-transfer`
# branch (commit 3da1024).
#
# The package is renamed so it can never be confused with the crates.io
# release; the lib target keeps the name `st3` so call sites don't churn.
[package]
name         = "youpipe-st3"
version      = "0.6.0"
authors      = ["Serge Barral <serge.barral@asynchronics.com>"]
edition      = "2021"
# Aligned with the youpipe workspace MSRV (upstream: 1.60); youpipe requires
# 1.85 anyway — see youpipe-concurrent-queue's comment.
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/asynchronics/st3"
description  = """
A very fast lock-free, bounded, work-stealing LIFO queue (youpipe fork).
"""
categories   = ["concurrency", "data-structures"]
keywords     = ["bounded", "lock-free", "queue", "stack", "work-stealing"]
autotests    = false
autobenches  = false

[lib]
name = "st3"

[[test]]
name = "integration"
path = "tests/tests.rs"

[[bench]]
harness = false
name    = "benchmark"
path    = "benches/benchmark.rs"

[[bench]]
harness = false
name    = "micro"
path    = "benches/micro.rs"

# NOTE: the upstream `[profile.bench]` pin (codegen-units=1, lto=true) is
# dropped here — profile settings in a dependency manifest are ignored by
# cargo; youpipe's root config governs.

[dependencies]
crossbeam-utils = { version = "0.8.14", default-features = false }

[dev-dependencies]
criterion       = "0.5"
crossbeam-deque = "0.8"
num_cpus        = "1.13"
oorandom        = "11.1"

[target."cfg(st3_loom)".dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(st3_loom)"] }
