# Miri configuration.
#
# The global compute pool (`ComputePool::global()`, held in a `OnceLock`)
# deliberately keeps its worker threads alive for the entire process lifetime
# — exactly like rayon's global pool — so they can be reused across pipeline
# runs. Under Miri this surfaces as
#   "the main thread terminated without waiting for all remaining threads"
# because those daemon-like workers are still parked when the test binary's
# main thread exits. The threads are intentionally leaked, not a bug, so we
# disable Miri's strict leak check. Per-test `ComputePool`s are dropped and
# joined cleanly via `Registry::drop`, so this only affects the by-design
# global pool.
#
# `force = false` (the default) keeps any caller-supplied `MIRIFLAGS`.
[env]
MIRIFLAGS = { value = "-Zmiri-ignore-leaks", force = false }

# ── Performance overrides ──
#
# The host's `~/.cargo/config.toml` may set `[profile]` tables that take
# precedence over the `[profile]` tables in Cargo.toml. A host
# `panic = "abort"` would neuter every `catch_unwind` in the pool/join
# machinery, so `-C panic=unwind` is forced here for ALL profiles — the
# library requires unwind semantics everywhere (tests included).
#
# `-C opt-level=3` deliberately does NOT live here: these rustflags are
# profile-blind, and an opt-level > 0 from this path made rustc infer
# `debug-assertions = off` for dev/test, silently compiling out the whole
# debug-side invariant layer of `cargo test` runs. dev/test opt-level is
# pinned in Cargo.toml's `[profile.dev]` instead, where cargo can emit the
# matching `-C debug-assertions=on`. Override or disable by setting
# `RUSTFLAGS` in the environment.
# `-C llvm-args=-align-all-functions=6` (64-byte function alignment): this
# crate is acutely codegen-layout-sensitive (single codegen unit — any
# unrelated source edit reshuffles the hot loops' instruction layout), with
# measured pure-layout swings of +29..+40 % (full history in attribution.md's
# layout-lottery section). 32 B (=5, adopted 2026-10) pinned function entries
# but not glue that may or may not be emitted at all: 5d199e7's per-type drop
# glue shifted a fused leaf ≡48 mod 64, across a 32 B uop-cache window
# (+33..+40 %, fixed in handoff/channel.rs `stage_batch`). 64 B (2026-11-08)
# pins every function start mod 64, closing that glue-emission class too; the
# landing A/B (attribution.md, layout-lottery section) found no systematic
# loss and damped the materialize-to-materialize spread of the rayon
# control rows from ±26 % (32 B) to ±2 %. It re-rolled every bench baseline
# once: saved criterion baselines from before the switch are void —
# comparisons must start from a fresh base.
# These live under `[target.'cfg(all())']`, not `[build]`: target-level
# rustflags from ANY config file in the hierarchy (this host's
# `~/.cargo/config.toml` sets `[target.'cfg(target_os = "linux")'] rustflags`
# for the mold linker) make cargo ignore `[build] rustflags` entirely, so a
# `[build]` section here silently never applied on such hosts (found 2026-11:
# 1789/3440 bench-binary functions unaligned to 32 B). `cfg(all())` always
# matches every target, so these flags win the same precedence race and
# compose with the host's target table.
[target."cfg(all())"]
rustflags = [
  "-C",
  "panic=unwind",
  "-C",
  "llvm-args=-align-all-functions=6",
]
