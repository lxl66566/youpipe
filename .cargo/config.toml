# ── Performance overrides ──
#
# The host's `~/.cargo/config.toml` may set `[profile]` tables that take
# precedence over the `[profile]` tables in Cargo.toml. A host
# `panic = "abort"` would neuter every `catch_unwind` in the pool/join
# machinery, so `-C panic=unwind` is forced here for ALL profiles — the
# library requires unwind semantics everywhere (tests included).
#
# `-C opt-level=3` deliberately does NOT live here: `[build] rustflags` is
# profile-blind, and an opt-level > 0 from this path made rustc infer
# `debug-assertions = off` for dev/test, silently compiling out the whole
# debug-side invariant layer of `cargo test` runs. dev/test opt-level is
# pinned in Cargo.toml's `[profile.dev]` instead, where cargo can emit the
# matching `-C debug-assertions=on`. Override or disable by setting
# `RUSTFLAGS` in the environment (Cargo appends those after these).
# `-C llvm-args=-align-all-functions=5` (32-byte function alignment): this
# crate is acutely codegen-layout-sensitive (single codegen unit — any
# unrelated source edit reshuffles the hot loops' instruction layout).
# Measured 2026-10: an async-only refactor (5e6bd83, code unreachable from
# the sync path) regressed horizontal cpu_balanced 100K-4M by +29..+40 %
# through pure layout shift; with 32 B function alignment the same commit
# measures 1.00x against its parent. The flag costs nothing on the aligned
# side (v0.6.0 base: 1.00x with/without) and converts the layout lottery
# into a stable grid. Not a complete cure: function-entry alignment cannot
# pin glue that may or may not be emitted at all — 5d199e7's Vec::extend
# landing pad monomorphized per-type drop glue that shifted the fused leaf
# ≡48 mod 64 (+33..+40 %, fixed in handoff/channel.rs `stage_batch`);
# `-align-all-functions=6` (64 B) would close that class too but re-rolls
# every bench baseline once (open, see attribution.md 2026-10-23).
[build]
rustflags = [
    "-C",
    "panic=unwind",
    "-C",
    "llvm-args=-align-all-functions=5",
]
# Miri configuration.
#
# The global compute pool (`ComputePool::global()`, held in a `OnceLock`)
# deliberately keeps its worker threads alive for the entire process lifetime
# — exactly like rayon's global pool — so they can be reused across pipeline
# runs. Under Miri this surfaces as
#   "the main thread terminated without waiting for all remaining threads"
# because those daemon-like workers are still parked when the test binary's
# main thread exits. The threads are intentionally leaked, not a bug, so we
# disable Miri's strict leak check. Per-test `ComputePool`s are dropped and
# joined cleanly via `Registry::drop`, so this only affects the by-design
# global pool.
#
# `force = false` (the default) keeps any caller-supplied `MIRIFLAGS`.
[env]
MIRIFLAGS = { value = "-Zmiri-ignore-leaks", force = false }
