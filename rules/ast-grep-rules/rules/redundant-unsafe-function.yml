# Project override of the built-in redundant-unsafe-function rule.
#
# Identical semantics, except the vendored fork crates are out of scope:
# their sources are byte-identical copies of externally maintained fork
# repos (crates/youpipe-concurrent-queue, crates/youpipe-crossfire,
# crates/youpipe-st3 — see AGENTS.md: fork sources must stay diffable and
# are not hand-modified; their own manifests carry the lint suppressions).
# The "document your unsafe boundary" contract applies to code this repo
# owns, which this rule still enforces at the built-in severity.
id: redundant-unsafe-function
language: Rust
severity: error
message: Unsafe function without unsafe block inside
ignores:
  - "crates/youpipe-concurrent-queue/**"
  - "crates/youpipe-crossfire/**"
  - "crates/youpipe-st3/**"
note: |
  A function marked `unsafe` advertises that the body contains operations the
  compiler cannot verify as safe. If the body has no `unsafe` block, either
  the marker is unnecessary (the function performs no unsafe operations and
  the `unsafe` keyword should be removed) or it is misplaced (an unsafe
  operation lives outside an `unsafe { … }` block and should be wrapped).
  Either case warrants review.

  Exempt when a `/// # Safety` doc-comment section precedes the function:
  Rust's own convention (rustdoc's `missing_safety_doc` lint, and
  clippy's `undocumented_unsafe_blocks`) is that an `unsafe fn` states
  its caller obligations in a `# Safety` doc section instead of wrapping
  its whole body in a redundant `unsafe { ... }` block — the function
  signature IS the unsafe boundary, the doc section is where the
  contract lives.

  NOTE (youpipe override): the contiguous backward comment scan stops at
  attribute siblings, so the `# Safety` section must sit directly above
  the `unsafe fn` (below any `#[attributes]`) to exempt.
rule:
  all:
    - kind: function_item
    - has:
        kind: function_modifiers
        regex: "^unsafe"
    - not:
        has:
          kind: unsafe_block
          stopBy: end
    - not:
        follows:
          stopBy:
            not:
              kind: line_comment
          kind: line_comment
          regex: '#\s*Safety'
