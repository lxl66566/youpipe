name: Test

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
      # Docs edits land through PRs like code; gate intra-book links before
      # any toolchain setup (fails fast, needs only bash + git).
      - run: perf/verify/linkcheck.sh
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --no-symlinks cargo-nextest
      - name: Setup sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo nextest run --all-features --no-tests pass && cargo test --doc && cargo check --examples
      - run: cargo check --no-default-features --examples
      - run: cargo clippy --all-features --all-targets -- -D warnings

  miri:
    name: miri (perf/verify/miri.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      # Parallel test jobs inside miri.sh's nextest groups (4 = the runner's
      # core count; the script's local default is 8).
      MIRI_JOBS: "4"
    steps:
      - uses: actions/checkout@v6
      - name: Setup sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Canonical runner, full default target list: lib + doctests + every
      # miri-meaningful integration binary + the vendored crossfire lib. The
      # strict MIRIFLAGS combo (tree-borrows + ignore-leaks), per-target
      # timeout and the deliberately-excluded binaries are the script's
      # (per-target durations: docs/src/dev/testing.md "Suite duration
      # census"; workloads scale down via `cfg!(miri)`).
      - run: perf/verify/miri.sh
        timeout-minutes: 90

  loom:
    name: loom model tests (perf/verify/loom.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v6
      - name: Setup sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9
      # Nightly, not stable: loom.sh's youpipe-st3 block passes
      # `-Z unstable-options --report-time` to the test harness, which a
      # stable-built harness rejects.
      - uses: dtolnay/rust-toolchain@nightly
      # Canonical runner: youpipe lib models plus the vendored
      # youpipe-concurrent-queue, youpipe-st3 and youpipe-crossfire waker
      # blocks. Per-block timeouts and LOOM_MAX_PREEMPTIONS are the
      # script's; full pass ≈ 10–30 min on the 32-core dev host.
      - run: perf/verify/loom.sh
        timeout-minutes: 45
