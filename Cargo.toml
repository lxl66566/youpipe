[workspace]
resolver        = "2"
members         = [
  "crates/youpipe",
  "crates/youpipe-bench",
  "crates/youpipe-concurrent-queue",
  "crates/youpipe-criterion-perf-counters",
  "crates/youpipe-crossfire",
  "crates/youpipe-gungraun",
  "crates/youpipe-hotpath",
  "crates/youpipe-st3",
  "crates/youpipe-sys",
]
# cargo-fuzz builds this crate standalone (nightly + sanitizer flags, own
# Cargo.lock); it must stay out of workspace resolution.
exclude         = ["crates/youpipe-fuzz"]
# Plain `cargo build/test/clippy` covers the library crates only; forks and
# bench crates are opt-in via `-p` / `--workspace` (heavyweight deps:
# aes-gcm, zstd, perf-event, valgrind runner, ...).
default-members = ["crates/youpipe", "crates/youpipe-sys"]

# Publish-train metadata. Forks inherit it too (manifest only; sources stay
# diffable upstream), and off-train crates (benches, youpipe-fuzz) set
# `publish = false`.
[workspace.package]
version      = "0.9.0"
edition      = "2024"
rust-version = "1.85"
repository   = "https://github.com/lxl66566/youpipe"
license      = "Apache-2.0"

# Members inherit with `{ workspace = true }` (may append features/optional);
# forks keep self-contained specs for diffability; youpipe-fuzz cannot
# inherit (excluded).
[workspace.dependencies]
criterion         = "0.8"
crossbeam-channel = "0.5"
libc              = "0.2"
log               = "0.4"
loom              = "0.7"
rayon             = "1"
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# path+version dual declaration: local builds resolve the path, published
# manifests the registry version (docs/src/dev/publishing.md). Bump these
# strings with `[workspace.package] version`. youpipe stays local: bench
# consumers need divergent `default-features`.
concurrent-queue = { package = "youpipe-concurrent-queue", path = "crates/youpipe-concurrent-queue", version = "0.9.0" }
crossfire        = { package = "youpipe-crossfire", path = "crates/youpipe-crossfire", version = "0.9.0" }
# youpipe's probes and the bench binary's HotpathGuard share process-global
# state: both crates must resolve one hotpath instance.
hotpath          = { package = "youpipe-hotpath", path = "crates/youpipe-hotpath", version = "0.9.0" }
st3              = { package = "youpipe-st3", path = "crates/youpipe-st3", version = "0.9.0" }
youpipe-sys      = { path = "crates/youpipe-sys", version = "0.9.0" }

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[workspace.lints.rust]
# `loom` is activated by `RUSTFLAGS="--cfg loom"` (see youpipe's manifest), not a feature
unexpected_cfgs       = { level = "warn", check-cfg = ["cfg(loom)"] }
unsafe_code           = "allow"
unused_qualifications = "warn"

# Debug symbols, no strip: Callgrind attributes instruction counts to source
# symbols (explicit `strip = false` in case release ever gains a default).
[profile.bench]
debug         = true
strip         = false
codegen-units = 1

# opt-level belongs in the profile table: [build] rustflags is profile-blind,
# and rustc infers debug-assertions/overflow-checks = off from opt-level > 0
# passed that way, silently compiling every debug-side invariant out of
# `cargo test` builds (see .cargo/config.toml). opt-level = 3 keeps the
# CPU-heavy stress tests fast.
[profile.dev]
opt-level        = 3
debug-assertions = true
overflow-checks  = true

# codegen-units = 1: the cargo default (16) makes hot-path instruction layout
# a lottery — unrelated edits reshuffle LLVM's codegen-unit partitioning and
# silently regress the leaf loops (measured ~18% at sync_cpu_heavy/100k from
# deleting an unused module). The slower release build is the standard
# perf-first trade-off (rayon, crossbeam, ...).
[profile.release]
codegen-units = 1
