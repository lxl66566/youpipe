[files]
include              = ["**/*.toml"]
# Vendored forks must stay diffable against their upstream repos: never
# reformat their manifests / rustfmt.toml.
exclude              = [
  "target/*",
  "node_modules/*",
  "crates/youpipe-concurrent-queue/*",
  "crates/youpipe-crossfire/*",
  "crates/youpipe-st3/*",
]
respect-ignore-files = true

[format.rules]
group-blank-lines-limit           = 1
indent-width                      = 2
key-value-equals-sign-alignment   = true
key-value-equals-sign-space-width = 1
line-ending                       = "lf"
line-width                        = 120

[[schemas]]
toml-version = "v1.0.0"
path         = "tombi://www.schemastore.org/cargo.json"
include      = ["Cargo.toml"]
